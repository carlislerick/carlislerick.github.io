<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Carlisle Rick's Personal Website">
    <title>Carlisle Rick</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 60px 40px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #667eea;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #666;
            margin-bottom: 30px;
        }

        .bio {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .link-button {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(102, 126, 234, 0.3);
        }

        .link-button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
        }

        .link-button.secondary {
            background: #48bb78;
            box-shadow: 0 4px 6px rgba(72, 187, 120, 0.3);
        }

        .link-button.secondary:hover {
            background: #38a169;
            box-shadow: 0 6px 12px rgba(72, 187, 120, 0.4);
        }

        footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #999;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .container {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Carlisle Rick</h1>
        <p class="subtitle">Welcome to My Page</p>
        <p class="bio">
            This is my personal website hosted on GitHub Pages. 
            I'm passionate about technology, coding, and building things that make a difference.
        </p>
        <div class="links">
            <a href="https://github.com/carlislerick" class="link-button" target="_blank" rel="noopener noreferrer">
                GitHub Profile
            </a>
            <a href="mailto:contact@example.com" class="link-button secondary">
                Get in Touch
            </a>
        </div>
        <footer>
            <p>&copy; 2026 Carlisle Rick. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
