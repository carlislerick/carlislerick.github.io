<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick Carlisle - Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Rick Carlisle</h1>
            <p class="subtitle">Software Developer</p>
        </div>

    <main class="container">
        <section id="about">
            <h2>About Me</h2>
            <div id="profile-info">
                <img id="avatar" src="" alt="Profile Picture">
                <div id="bio">
                    <p>Welcome to my portfolio! Here you can find the projects I've been working on.</p>
                </div>
            </div>
        </section>

        <section id="projects">
            <h2>My Projects</h2>
            <div id="loading">Loading repositories...</div>
            <div id="repositories" class="repo-grid"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Rick Carlisle. View my work on <a href="https://github.com/carlislerick" target="_blank">GitHub</a></p>
        </div>
    </footer>

    <script src="script.js"></script>

</html>
